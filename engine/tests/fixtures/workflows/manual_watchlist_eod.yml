name: Manual watchlist EOD snapshot

# Separate completion-triggered workflow: optional collection cannot alter the
# core watchlist workflow's success or completion timestamp.
on:
  workflow_run:
    workflows: [watchlist]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: manual-watchlist-eod
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check private catalog read credential
        env:
          MANUAL_CATALOG_READ_TOKEN: ${{ secrets.MANUAL_CATALOG_READ_TOKEN }}
        run: |
          if [[ -z "${MANUAL_CATALOG_READ_TOKEN//[[:space:]]/}" ]]; then
            echo '::error title=CATALOG_READ_TOKEN_NOT_CONFIGURED::Set the engine repository Actions secret MANUAL_CATALOG_READ_TOKEN with Contents: read access to example-owner/trend-leader-watchlist.'
            echo 'EOD publication blocked: configure MANUAL_CATALOG_READ_TOKEN in this repository Actions secrets. It must read Contents of example-owner/trend-leader-watchlist. The app CSV is local; changing Streamlit secrets will not fix this failure. After setup, the next successful watchlist run will trigger EOD publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: watchlist/requirements.txt
      - run: pip install -r watchlist/requirements.txt
      # No fallback cache key and no restore from PR/untrusted runs.
      - uses: actions/cache/restore@v4
        id: core_cache
        with:
          path: watchlist/data
          key: wl-cache-${{ github.event.workflow_run.id }}
      - name: Build independently validated EOD snapshot
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_CATALOG_READ_TOKEN: ${{ secrets.MANUAL_CATALOG_READ_TOKEN }}
          PYTHON_DOTENV_DISABLED: '1'
          CORE_CACHE_HIT: ${{ steps.core_cache.outputs.cache-hit }}
        run: |
          core_cache_dir="$(mktemp -d)"
          if [[ "$CORE_CACHE_HIT" == 'true' ]]; then core_cache_dir='watchlist/data'; fi
          python -m watchlist.manual_eod_publish --event "$GITHUB_EVENT_PATH" --data "$core_cache_dir" --diagnostics "$RUNNER_TEMP/manual-eod-diagnostics"
      - name: Upload read-only cache census and HTTP accounting
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manual-eod-diagnostics-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/manual-eod-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit manual namespace only if core publication is still current
        env:
          CORE_RUN_ID: ${{ steps.snapshot.outputs.core_run_id }}
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add -- watchlist/published/manual_eod
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "manual-eod: confirmed observation snapshot"
          git pull --rebase origin main
          python -m watchlist.manual_eod_publish --verify-core "$CORE_RUN_ID"
          git push origin HEAD:main


