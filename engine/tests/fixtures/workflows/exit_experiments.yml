name: Exit policy research

# Independent optional research; does not change the core workflow result/time.
on:
  workflow_run:
    workflows: [watchlist]
    branches: [main]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: exit-policy-research
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            watchlist/requirements.txt
            .github/workflows/exit-research-v2-constraints.txt
      - name: Install audited v2 runtime without changing core engine dependencies
        run: |
          python -m pip install -r watchlist/requirements.txt -c .github/workflows/exit-research-v2-constraints.txt
          python -m pip check
      - uses: actions/cache/restore@v4
        id: core_cache
        with:
          path: watchlist/data
          key: wl-cache-${{ github.event.workflow_run.id }}
      - name: Require exact trusted cache from first successful main attempt
        env:
          CACHE_HIT: ${{ steps.core_cache.outputs.cache-hit }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [[ "$CACHE_HIT" != 'true' || "$RUN_ATTEMPT" != '1' ]]; then
            echo 'No uniquely attributable trusted core cache; previous research remains unchanged.'
            exit 1
          fi
      - name: Build independent research publication without price downloads
        id: research
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCHLIST_VERIFY_PUBLICATIONS: 'true'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -m watchlist.exit_experiment_publish --event "$GITHUB_EVENT_PATH"
      - name: Commit research namespace only while source remains current
        env:
          CORE_RUN_ID: ${{ steps.research.outputs.core_run_id }}
          CORE_MANIFEST_HASH: ${{ steps.research.outputs.core_manifest_hash }}
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add -- watchlist/published/exit_experiments
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: versioned parallel exit experiments"
          git pull --rebase origin main
          python -m watchlist.exit_experiment_publish --verify-core "$CORE_RUN_ID" --verify-core-hash "$CORE_MANIFEST_HASH"
          git push origin HEAD:main

